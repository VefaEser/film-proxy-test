
name: Turso Migration

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Gerçek SQL uygulamasını başlat"
        required: false
        default: false
        type: boolean

# Aynı Turso veritabanına eşzamanlı migration çalıştırılmasını önle.
# cancel-in-progress=false: devam eden migration iptal edilmez; sonraki çalışma sırada bekler.
concurrency:
  group: turso-database-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install migration dependency
        run: npm install --no-save --no-package-lock @libsql/client@^0.15.15

      - name: Run migration checks
        env:
          TEST_TURSO_DATABASE_URL: ${{ secrets.TEST_TURSO_DATABASE_URL }}
          TEST_TURSO_AUTH_TOKEN: ${{ secrets.TEST_TURSO_AUTH_TOKEN }}
          APPLY_MIGRATIONS: ${{ inputs.apply }}
        run: node scripts/turso-migrate.mjs
